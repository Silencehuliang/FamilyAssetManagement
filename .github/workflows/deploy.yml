name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure deploy guard
        id: guard
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: echo "deploy=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Skip when Cloudflare secrets are not configured yet
        if: steps.guard.outputs.deploy != 'true'
        run: echo 'CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set; run `pnpm deploy` locally instead.'
      - uses: cloudflare/wrangler-action@v3
        if: steps.guard.outputs.deploy == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name family-ledger
