<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 · #11 前端信息架构 · 导航结构线框</title>
<!--
  ════════════════════════════════════════════════════════════════════════════
  一次性产物（prototype）。用途：回答 #11 «前端信息架构与页面清单» 的导航结构问题。

  它回答的问题：4 种导航形态里哪一种最合适；两套子系统（支出 / 股票）怎么并存；
  三条高频路径各要几步；Web 为辅那一侧到底要不要分叉。

  ⚠️ 这不是实现。没有真实数据、没有状态管理、没有持久化、没有错误处理。
     样式刻意做成低保真（灰块 + 虚线框），为的是让人讨论结构而不是配色。
     变体代码**不得**被直接提升为生产代码 —— 要按项目规范重写。

  运行方式：浏览器直接打开本文件（零依赖、零构建）。

  步数度量口径：见文件末尾 MEASURE 一节。它由本文件内的导航图经 BFS 算出，
  可被任何人复跑（同一份代码 = 同一组数字）。**不是用户研究数据。**
  ════════════════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --bg:#14171c; --panel:#1b1f26; --line:#2a303a; --txt:#e6e9ee; --dim:#98a2b3;
  --paper:#ffffff; --ink:#2b3038; --wfill:#eef0f3; --wline:#c9ced6; --wdash:#b9c0c9;
  --accent:#5b8def; --warn:#d99a2b; --bad:#d96a6a; --ok:#3f9e73;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.topbar h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.02em}
.topbar .proto{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--warn);
  border:1px dashed var(--warn);border-radius:3px;padding:1px 6px}
.topbar .spacer{flex:1}
.ctrl{display:flex;align-items:center;gap:6px;font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
button.tg{background:#222832;color:var(--txt);border:1px solid var(--line);border-radius:3px;
  padding:3px 8px;font:11px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
button.tg:hover{border-color:#3b4560}
button.tg.on{background:var(--accent);border-color:var(--accent);color:#0d1014;font-weight:600}
.stage{display:flex;justify-content:center;padding:22px 16px 110px}
.device{background:var(--paper);color:var(--ink);position:relative;overflow:hidden;
  border:9px solid #0b0e12;border-radius:26px;box-shadow:0 22px 60px rgba(0,0,0,.55);
  width:390px;height:790px;transition:width .18s,height .18s,border-radius .18s}
.device.desktop{width:1120px;height:720px;border-radius:12px;border-width:1px;border-color:#39414d}
.screen{position:absolute;inset:0;overflow:auto;background:#fff}
.screen.dk{background:#fbfcfd}
.pad{padding:12px 13px 96px}
.pad.pc{padding:14px 18px 18px}

/* ---- 低保真元件 ---- */
.w{background:var(--wfill);border:1px solid var(--wline);border-radius:3px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.wd{background:#f8f9fb;border:1px dashed var(--wdash);border-radius:3px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.lb{font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#6b7480}
.lb.on{color:#20242b;font-weight:600}
.lb.mut{color:#9aa2ad}
.sec{font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:#8a929d;
  margin:14px 0 6px;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:1px solid var(--wline);
  border-radius:11px;background:#f4f6f8;font:11px ui-monospace,Menlo,Consolas,monospace;color:#4d5561}
.tag.sel{background:#dfe7f7;border-color:#9db4dd;color:#22365c}
.tag.ghost{opacity:.42;text-decoration:line-through}
.badge{display:inline-block;font:10px ui-monospace,Menlo,Consolas,monospace;padding:1px 5px;
  border-radius:3px;border:1px solid currentColor}
.b-pend{color:#2f6fd0;background:#e8f0fd}
.b-fail{color:#b4483f;background:#fdeceb}
.b-old{color:#8a6a12;background:#fdf6e3}
.b-ok{color:#2b7a56;background:#e9f6ef}
.b-mut{color:#7b838e;background:#f1f3f6}
.dis{opacity:.38;position:relative}
.dis::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,
  transparent,transparent 5px,rgba(120,130,145,.13) 5px,rgba(120,130,145,.13) 6px);border-radius:3px}
.note{font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#7b838e}
.note.warn{color:#a9772a}
.note.bad{color:#b4483f}
.why{font:10px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#b4483f;margin-top:3px}
.wbar{height:10px;background:#e7eaee;border-radius:5px;overflow:hidden;position:relative}
.wbar > i{display:block;height:100%;background:#aeb9c7}
.thr{position:absolute;top:-3px;bottom:-3px;width:2px;background:#c9a02e}
.thr.b{background:#c0564d}
table.t{width:100%;border-collapse:collapse;font:11px ui-monospace,Menlo,Consolas,monospace}
table.t th,table.t td{border:1px solid #e2e6eb;padding:4px 6px;text-align:left;color:#4d5561}
table.t th{background:#f4f6f8;color:#6b7480;font-weight:600}
table.t td.num{text-align:right}
.virt{font-style:italic;color:#8a929d}
.fin{width:100%;height:50px;font:22px ui-monospace,Menlo,Consolas,monospace;color:#20242b;
  background:var(--wfill);border:1px solid var(--wline);border-radius:3px;padding:0 10px;text-align:right}
.fin::placeholder{color:#9aa2ad}

/* ---- 壳：Tab 栏 / 顶部栏 / 抽屉 ---- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;
  border-top:1px solid #e4e8ed;background:#fcfdfe;z-index:6}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font:10px ui-monospace,Menlo,Consolas,monospace;color:#8a929d;border:0;background:none;cursor:pointer;padding:0}
.tabbar .tb .dot{width:18px;height:18px;border:1px solid #c9ced6;border-radius:5px;background:#eef0f3}
.tabbar .tb.on{color:#20242b;font-weight:600}
.tabbar .tb.on .dot{background:#cfd9ea;border-color:#9db4dd}
.tabbar .tb.raise .dot{width:38px;height:30px;border-radius:9px;background:#dbe4f4;border-color:#9db4dd}
.topnav{position:absolute;left:0;right:0;top:0;height:46px;z-index:6;background:#fcfdfe;
  border-bottom:1px solid #e4e8ed;display:flex;align-items:center;gap:10px;padding:0 12px}
.topnav .hamb{width:26px;height:22px;border:1px solid var(--wline);border-radius:3px;background:#eef0f3;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font:12px monospace;color:#5b6472}
.topnav .ttl{font:12px ui-monospace,Menlo,Consolas,monospace;color:#3b434e;font-weight:600}
.backbtn{border:1px solid var(--wline);background:#f4f6f8;border-radius:3px;padding:1px 7px;
  font:11px ui-monospace,Menlo,Consolas,monospace;color:#5b6472;cursor:pointer}
.drawer{position:absolute;top:0;bottom:0;left:0;width:74%;background:#f7f9fb;z-index:20;
  border-right:1px solid #dfe4ea;padding:14px 12px;overflow:auto;box-shadow:6px 0 22px rgba(20,25,35,.16)}
.drawer h4{margin:0 0 10px;font:11px ui-monospace,Menlo,Consolas,monospace;color:#8a929d;font-weight:600}
.ditem{display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid var(--wline);background:#fff;border-radius:4px;padding:8px 10px;margin-bottom:6px;
  font:12px monospace;color:#3b434e;cursor:pointer}
.ditem.d2{margin-left:14px;background:#fbfcfd}
.ditem .dep{font:10px monospace;color:#9aa2ad}
.seg{display:flex;border:1px solid var(--wline);border-radius:5px;overflow:hidden;background:#f4f6f8;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:6px 0;font:11px ui-monospace,Menlo,Consolas,monospace;
  color:#6b7480;cursor:pointer}
.seg button.on{background:#dbe4f4;color:#22365c;font-weight:600}
.banner{border:1px solid #9db4dd;background:#eef3fc;border-radius:4px;padding:7px 9px;margin-bottom:8px;
  font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#2b4c85}
.banner.sw{border-color:#bcae86;background:#fdf8ec;color:#7a6425}
.banner.ios{border-color:#a9bda9;background:#eef6ef;color:#3c6144}
.banner .x{float:right;cursor:pointer;color:#8a929d}
.acts{position:absolute;left:0;right:0;bottom:0;padding:10px 13px;background:linear-gradient(#ffffff00,#fff 28%);
  z-index:5;display:flex;gap:8px}
.acts button{flex:1;border:1px solid #9db4dd;background:#dbe4f4;border-radius:6px;padding:10px 0;
  font:12px ui-monospace,Menlo,Consolas,monospace;color:#22365c;font-weight:600;cursor:pointer}
.acts button.sec2{border-color:var(--wline);background:#f4f6f8;color:#5b6472;font-weight:400;flex:0 0 96px}

/* ---- 切换器（不属于被评测的设计） ---- */
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;
  display:flex;align-items:center;gap:10px;background:#0b0e12;border:1px solid #3a4256;
  border-radius:999px;padding:7px 12px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.switcher button{width:26px;height:26px;border-radius:50%;border:1px solid #3a4256;background:#1b1f26;
  color:var(--txt);cursor:pointer;font:12px monospace}
.switcher .vl{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--txt);min-width:176px;text-align:center}
.switcher .vl b{color:#8fb0ef}

/* ---- 度量面板 ---- */
.mpanel{position:fixed;right:14px;top:64px;z-index:35;width:352px;max-height:76vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 13px;
  box-shadow:0 12px 34px rgba(0,0,0,.5)}
.mpanel h3{margin:0 0 8px;font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--warn);letter-spacing:.04em}
.mpanel table{width:100%;border-collapse:collapse;font:11px ui-monospace,Menlo,Consolas,monospace}
.mpanel th,.mpanel td{border:1px solid var(--line);padding:3px 5px;text-align:left;color:var(--dim)}
.mpanel th{color:#c3cad6;background:#222832}
.mpanel td.v{text-align:right;color:var(--txt)}
.mpanel td.best{color:#6fcf9d;font-weight:600}
.mpanel td.worst{color:#e0897f}
.mpanel p{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);margin:8px 0 0}
.mpanel .hint{color:#7f8896}
.tracebox{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#c3cad6;background:#222832;
  border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin-top:8px;word-break:break-all}
.toggle-panel{position:fixed;right:14px;top:64px;z-index:36}
</style>
</head>
<body>

<div class="topbar">
  <h1>#11 前端信息架构 · 导航结构线框</h1>
  <span class="proto">PROTOTYPE · 一次性产物 · 非实现</span>
  <span class="spacer"></span>
  <div class="ctrl">
    <span>网络</span>
    <button class="tg on" id="tg-net">在线</button>
    <span>队列</span>
    <button class="tg" id="tg-q">0</button>
    <span>新版本</span>
    <button class="tg" id="tg-sw">无</button>
    <span>视口</span>
    <button class="tg" id="tg-vp">手机</button>
    <button class="tg on" id="tg-m">度量</button>
  </div>
</div>

<div class="stage"><div class="device" id="device"></div></div>

<div class="mpanel" id="mpanel"></div>

<div class="switcher">
  <button id="prev" title="上一个变体（← 键）">‹</button>
  <span class="vl" id="vl"></span>
  <button id="next" title="下一个变体（→ 键）">›</button>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   0. 全局开关（原型用的假状态，全在内存里，刷新即重置）
   ══════════════════════════════════════════════════════════════════════════ */
var ST = {
  online: true,      // 在线 / 离线
  queue: 2,          // 待同步条数（0..3 循环）
  swUpdate: false,   // 是否有新版本待更新
  desktop: false,    // 手机 / 桌面视口
  panel: true,       // 度量面板
  variant: 'A',
  page: 'home',
  seg: {},           // 各变体的分段控件状态（B 的资产页）
  drawer: false,
  taps: 0,           // 用户实际点击数（自由玩耍用）
  trace: [],         // 用户实际点击路径
  saved: null,       // 上一次保存的结果（原型用）
  guided: false      // 安装引导是否已被永久关闭
};

/* ══════════════════════════════════════════════════════════════════════════
   1. 低保真元件
   ══════════════════════════════════════════════════════════════════════════ */
function wf(h, label, extra) {
  return '<div class="w" style="height:' + h + 'px;' + (extra || '') + '">' +
    (label ? '<span class="lb">' + label + '</span>' : '') + '</div>';
}
function dash(h, label, extra) {
  return '<div class="wd" style="height:' + h + 'px;' + (extra || '') + '">' +
    (label ? '<span class="lb mut">' + label + '</span>' : '') + '</div>';
}
function sec(t) { return '<div class="sec">' + t + '</div>'; }
function note(t, cls) { return '<div class="note ' + (cls || '') + '">' + t + '</div>'; }
function tag(t, cls) { return '<span class="tag ' + (cls || '') + '">' + t + '</span>'; }
function badge(t, cls) { return '<span class="badge ' + cls + '">' + t + '</span>'; }
function qbadge() {
  if (ST.queue <= 0) return '';
  return ' ' + badge('待同步 ' + ST.queue, 'b-pend');
}

/* 图表占位：本票只定「哪里放什么图」，库选型留在雾区 */
function chart(h, caption) {
  return '<div class="wd" style="height:' + h + 'px;flex-direction:column;gap:4px">' +
    '<span class="lb mut">［图］</span><span class="lb mut">' + caption + '</span></div>';
}

/* 离线置灰：必须说明原因，不能只灰不说（#10 派生要求 5） */
function disabled(h, reason) {
  return '<div class="dis" style="border-radius:4px">' + h + '</div>' +
    '<div class="why">离线不可用 · ' + reason + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   2. 页面（屏幕内容）—— 四个变体共用同一套内容，变体只换导航壳与可达深度
      所有字段、单位、口径均来自已冻结的上游决策
   ══════════════════════════════════════════════════════════════════════════ */

/* 全局横幅（条件渲染）—— #10 派生要求 1 / 4 / 7 */
function banners() {
  var o = '';
  if (!ST.online && ST.queue > 0) {
    o += '<div class="banner">离线 · 另有 ' + ST.queue + ' 条待同步未计入汇总 <span class="x" data-go="queue">查看 ›</span></div>';
  }
  if (ST.swUpdate) {
    var q = ST.queue > 0 ? '（含 ' + ST.queue + ' 条待同步）' : '';
    o += '<div class="banner sw">有新版本可用' + q + '　刷新不会丢失待同步记录' +
      '<span class="x" data-go="home">更新</span></div>';
  }
  /* iOS 安装引导：已登录 + 非 standalone + 从未引导过 ⇒ 一次性、可永久关闭 */
  if (!ST.desktop && !ST.guided) {
    o += '<div class="banner ios">把这个站加到主屏幕更好用：分享 → 添加到主屏幕' +
      '<span class="x" data-guide="1">关闭</span></div>';
  }
  return o;
}

/* 全局「待同步」指示器 —— #10 派生要求 1（任一页面可见） */
function pendIndicator() {
  if (ST.queue <= 0) return '';
  return '<div class="row" style="justify-content:space-between;margin:2px 0 8px">' +
    '<span class="lb mut">' + (ST.online ? '在线' : '离线') + '</span>' +
    '<span class="lb on" data-go="queue" style="cursor:pointer">待同步 ' + ST.queue + ' 条 ›</span></div>';
}

var SCR = {};

/* ---- 登录页（唯一未认证页面；没有注册页） ---- */
SCR.login = function () {
  return '<div class="pad" style="padding-top:64px">' +
    '<div style="text-align:center;margin-bottom:26px">' +
    wf(46, '家庭财务', 'width:150px;margin:0 auto;font-weight:600') +
    '</div>' +
    '<div class="col">' +
    wf(38, '用户名') + wf(38, '密码') +
    '</div>' +
    '<div class="row" style="margin-top:10px">' +
    wf(34, '登 录', 'flex:1;background:#cfd9ea;border-color:#9db4dd') + '</div>' +
    '<div style="margin-top:18px">' +
    note('· 无「注册」入口 —— 这个端点不存在，不是被禁用') +
    note('· 失败固定延迟 500ms；不区分「用户不存在」与「密码错」') +
    note('· 首次在 PWA 里打开要登录一次（与 Safari 是两套容器）') +
    '</div></div>';
};

/* ---- 首页 ---- */
SCR.home = function (v) {
  var s = '<div class="pad">';
  s += '<div class="row" style="justify-content:space-between">' +
    '<div><div class="lb on" style="font-size:13px">胡先森</div>' +
    '<div class="note">本月 · 2026-09（CST 自然月）</div></div>' +
    '<div>' + (ST.online ? badge('在线', 'b-ok') : badge('离线', 'b-mut')) + '</div></div>';
  s += sec('本月总支出');
  s += wf(52, '¥ 8,432.50', 'font-size:20px');
  s += sec('预算（家庭总预算）');
  s += '<div class="wbar" style="margin:2px 0 4px"><i style="width:62%"></i>' +
    '<span class="thr" style="left:80%"></span><span class="thr b" style="left:100%"></span></div>';
  s += note('已用 62% · 预警线 80%（消耗 ≥ 上限×阈值）· 超支线 100%');
  s += note('超支不阻断录入，仅标记 + 非阻塞提示');
  if (!ST.online && ST.queue > 0) {
    s += note('离线时汇总只显示缓存值，队列项不计入 —— 不复刻服务端聚合口径', 'warn');
  }
  s += sec('类别 Top 5（当前基线解释，实时聚合）');
  var cats = [['餐饮', 34], ['住房', 26], ['出行', 15], ['医疗', 9], ['其他', 6]];
  s += '<div class="col" style="gap:5px">';
  for (var i = 0; i < cats.length; i++) {
    s += '<div class="row"><span class="lb" style="width:42px">' + cats[i][0] + '</span>' +
      '<div class="wbar" style="flex:1"><i style="width:' + cats[i][1] + '%"></i></div>' +
      '<span class="lb mut" style="width:30px;text-align:right">' + cats[i][1] + '%</span></div>';
  }
  s += '</div>';
  s += sec('入口');
  if (v === 'C') {
    /* 变体 C：首页即聚合入口，二级页都从这里进 */
    s += '<div class="grid2">' +
      wf(60, '流水') + wf(60, '支出分析') +
      wf(60, '预算') + wf(60, '股票持仓') +
      wf(60, '收益趋势') + wf(60, '标签管理') +
      wf(60, '除权确认') + wf(60, '设置') +
      '</div>';
  } else {
    s += '<div class="grid3">' + wf(58, '流水') + wf(58, '支出分析') + wf(58, '预算') + '</div>' +
      '<div class="grid3" style="margin-top:8px">' + wf(58, '股票持仓') + wf(58, '收益趋势') + wf(58, '标签管理') + '</div>';
  }
  s += sec('运行状态（心跳表 cron_run）');
  s += '<table class="t"><tr><th>task</th><th>上次成功运行</th><th>状态</th></tr>' +

/* ══════════════════════════════════════════════════════════════════════════
   4. 步数度量 —— 由导航图经 BFS 算出，可被任何人复跑
      口径：一次「点击」计 1 步（不含键盘输入）；「保存」本身计 1 步。
   ══════════════════════════════════════════════════════════════════════════ */
var NAV = {
  /* 每个变体：tab 集合 + 有向边（含返回与全局指示器）*/
  A: {
    tabs: ['home', 'ledger', 'entry', 'stock', 'me'],
    edges: [
      ['home', 'expense'], ['home', 'budget'], ['home', 'queue'],
      ['stock', 'trend'], ['stock', 'ca'], ['stock', 'queue'],
      ['me', 'tags'], ['me', 'queue'],
      ['ledger', 'queue'], ['entry', 'queue'], ['expense', 'queue'],
      ['budget', 'queue'], ['trend', 'queue'], ['ca', 'queue'], ['tags', 'queue']
    ]
  },
  B: {
    tabs: ['home', 'ledger', 'entry', 'assets'],
    edges: [
      ['assets', 'budget'], ['assets', 'expense'], ['assets', 'tags'],
      ['assets', 'stock'], ['assets', 'trend'], ['assets', 'ca'],
      ['home', 'queue'], ['ledger', 'queue'], ['entry', 'queue'],
      ['assets', 'queue'], ['budget', 'queue'], ['expense', 'queue'],
      ['tags', 'queue'], ['stock', 'queue'], ['trend', 'queue'], ['ca', 'queue']
    ]
  },
  C: {
    tabs: ['home', 'entry', 'me'],
    edges: [
      ['home', 'ledger'], ['home', 'expense'], ['home', 'budget'],
      ['home', 'stock'], ['home', 'trend'], ['home', 'tags'],
      ['home', 'ca'], ['home', 'queue'],
      ['me', 'queue'], ['entry', 'queue'], ['ledger', 'queue'],
      ['expense', 'queue'], ['budget', 'queue'], ['stock', 'queue'],
      ['trend', 'queue'], ['tags', 'queue'], ['ca', 'queue']
    ]
  },
  D: {
    tabs: [],
    /* 抽屉变体没有底部栏 ⇒ 任何页面到任何页面都要「先开抽屉、再点条目」= 2 步。
       用中间节点 drawer 显式表达，避免把这个成本悄悄漏掉。 */
    edges: (function () {
      var ps = ['home', 'ledger', 'entry', 'expense', 'budget', 'stock',
        'trend', 'ca', 'tags', 'queue', 'me'];
      var e = [];
      for (var i = 0; i < ps.length; i++) {
        e.push([ps[i], 'drawer']);   /* 打开抽屉 = 1 步 */
        e.push(['drawer', ps[i]]);   /* 选中条目 = 1 步 */
      }
      return e;
    })()
  }
};

var ALL_PAGES = ['home', 'ledger', 'entry', 'expense', 'budget', 'stock', 'trend', 'ca', 'tags', 'queue', 'me'];

/* 由变体定义构建邻接表：Tab 之间两两可达（1 步）；非 Tab 页可 1 步回首页 */
function buildAdj(v) {
  var n = NAV[v], adj = {};
  function add(a, b) { (adj[a] = adj[a] || []).push([b, 1]); }
  for (var i = 0; i < n.tabs.length; i++) {
    for (var j = 0; j < n.tabs.length; j++) if (i !== j) add(n.tabs[i], n.tabs[j]);
  }
  for (var e = 0; e < n.edges.length; e++) add(n.edges[e][0], n.edges[e][1]);
  /* 非 Tab 页有返回键 ⇒ 1 步回首页；抽屉变体已在上面的 edges 里显式给出 */
  if (v !== 'D') {
    for (var p = 0; p < ALL_PAGES.length; p++) {
      var pg = ALL_PAGES[p];
      var isT = n.tabs.indexOf(pg) >= 0;
      if (!isT) add(pg, 'home');
    }
  }
  return adj;
}

/* BFS：从 from 到 to 的最少步数；不可达返回 null */
function bfs(adj, from, to) {
  if (from === to) return 0;
  var seen = {}, q = [[from, 0]];
  seen[from] = 1;
  while (q.length) {
    var cur = q.shift(), node = cur[0], d = cur[1];
    var nxt = adj[node] || [];
    for (var i = 0; i < nxt.length; i++) {
      var nb = nxt[i][0];
      if (seen[nb]) continue;
      if (nb === to) return d + 1;
      seen[nb] = 1;
      q.push([nb, d + 1]);
    }
  }
  return null;
}

/* 三条高频路径的度量 */
function measure(v) {
  var adj = buildAdj(v);
  var SAVE = 1; /* 表单打开后再点「保存」= 1 步 */
  var r1 = bfs(adj, 'home', 'entry');
  var r2 = bfs(adj, 'entry', 'ledger');
  var r3 = bfs(adj, 'home', 'stock');
  var worst = 0, worstFrom = '';
  for (var i = 0; i < ALL_PAGES.length; i++) {
    var d = bfs(adj, ALL_PAGES[i], 'entry');
    if (d !== null && d > worst) { worst = d; worstFrom = ALL_PAGES[i]; }
  }
  return {
    v: v,
    r1: r1 === null ? null : r1 + SAVE,
    r2: r2,
    r3: r3,
    worst: worst + SAVE,
    worstFrom: worstFrom
  };
}

function renderPanel() {
  var html = '<h3>步数度量（本原型内 BFS 计算）' +
    '<span class="hint" style="float:right;cursor:pointer" id="panel-x">收起 ✕</span></h3>';
  html += '<table><tr><th>变体</th><th>①首页→记账→保存</th><th>②记完→看流水</th><th>③首页→股票</th><th>最坏→记账</th></tr>';
  var best1 = 99, best2 = 99, best3 = 99, bestW = 99;
  var ms = [];
  for (var i = 0; i < VARIANTS.length; i++) {
    var m = measure(VARIANTS[i].k);
    ms.push(m);
    if (m.r1 < best1) best1 = m.r1;
    if (m.r2 < best2) best2 = m.r2;
    if (m.r3 < best3) best3 = m.r3;
    if (m.worst < bestW) bestW = m.worst;
  }
  for (var k = 0; k < ms.length; k++) {
    var m2 = ms[k];
    html += '<tr><td>' + m2.v + '</td>' +
      '<td class="v ' + (m2.r1 === best1 ? 'best' : '') + '">' + m2.r1 + ' 步</td>' +
      '<td class="v ' + (m2.r2 === best2 ? 'best' : '') + '">' + m2.r2 + ' 步</td>' +
      '<td class="v ' + (m2.r3 === best3 ? 'best' : '') + '">' + m2.r3 + ' 步</td>' +
      '<td class="v ' + (m2.worst === bestW ? 'best' : 'worst') + '">' + m2.worst + ' 步</td></tr>';
  }
  html += '</table>';
  html += '<p>口径：一次点击 = 1 步（不含键盘输入）；「保存」本身计 1 步。' +
    '第 ③ 列表述的是「首页 → 看到股票持仓」。最坏列 = 从最深层页面出发到保存。' +
    '数字由本文件内的导航图 BFS 算出，可复跑；<b>不是用户研究数据</b>。</p>';
  html += '<p class="hint">变体定义：';
  for (var q = 0; q < VARIANTS.length; q++) {
    html += VARIANTS[q].k + ' = ' + VARIANTS[q].name + '（' + VARIANTS[q].desc + '）　';
  }

    (ST.trace.length ? ST.trace.join(' → ') : '（还没点）') +
    '<br><span class="hint" id="trace-x" style="cursor:pointer">重置计数</span></div>';
  return html;
}

/* 记录一次用户点击（自由玩耍用，与上方 BFS 度量是两回事） */
function tap(label) {
  ST.taps++;
  ST.trace.push(label);
  if (ST.trace.length > 14) ST.trace.shift();
}

function go(p) {
  tap(TITLE[p] || p);
  ST.page = p;
  ST.drawer = false;
  render();
}

/* URL 同步：变体可分享、刷新后稳定。file:// 下 replaceState 可能抛错，回退到 hash */
function setVariant(k) {
  ST.variant = k;
  ST.page = (k === 'C') ? 'home' : 'home';
  ST.seg = {};
  ST.drawer = false;
  ST.taps = 0;
  ST.trace = [];
  ST.saved = null;
  try { history.replaceState(null, '', '?variant=' + k); }
  catch (e) { try { location.hash = 'variant=' + k; } catch (e2) {} }
  render();
}
function readVariant() {
  var s = (location.search || '').replace(/^\?/, '');
  var m = /(?:^|&)variant=([A-D])/.exec(s);
  if (m) return m[1];
  var h = /variant=([A-D])/.exec(location.hash || '');
  if (h) return h[1];
  return 'A';
}

device.addEventListener('click', function (ev) {
  var t = ev.target;
  while (t && t !== device) {
    if (t.dataset) {
      if (t.dataset.go) { go(t.dataset.go); return; }
      if (t.dataset.drawer) { ST.drawer = !ST.drawer; tap(ST.drawer ? '打开抽屉' : '收起抽屉'); render(); return; }
      if (t.dataset.guide) { ST.guided = true; tap('关闭安装引导'); render(); return; }
      if (t.dataset.axis) { ST.seg.axis = t.dataset.axis; render(); return; }
      if (t.dataset.bseg) { ST.seg.bseg = t.dataset.bseg; render(); return; }
      if (t.dataset.act === 'clearsave') { ST.saved = null; ST.taps = 0; ST.trace = []; render(); return; }
      if (t.dataset.act === 'save') {
        tap('保存');
        ST.saved = { n: ST.taps, v: ST.variant };
        render();
        return;
      }
    }
    t = t.parentNode;
  }
});

mpanel.addEventListener('click', function (ev) {
  if (ev.target.id === 'panel-x') { ST.panel = false; render(); }
  if (ev.target.id === 'trace-x') { ST.taps = 0; ST.trace = []; render(); }
});

document.getElementById('tg-net').onclick = function () { ST.online = !ST.online; render(); };
document.getElementById('tg-q').onclick = function () { ST.queue = (ST.queue + 1) % 4; render(); };
document.getElementById('tg-sw').onclick = function () { ST.swUpdate = !ST.swUpdate; render(); };
document.getElementById('tg-vp').onclick = function () { ST.desktop = !ST.desktop; render(); };
document.getElementById('tg-m').onclick = function () { ST.panel = !ST.panel; render(); };

function cycle(dir) {
  var idx = 0;
  for (var i = 0; i < VARIANTS.length; i++) if (VARIANTS[i].k === ST.variant) idx = i;
  var n = (idx + dir + VARIANTS.length) % VARIANTS.length;
  setVariant(VARIANTS[n].k);
}
document.getElementById('prev').onclick = function () { cycle(-1); };
document.getElementById('next').onclick = function () { cycle(1); };

document.addEventListener('keydown', function (ev) {
  var a = document.activeElement;
  if (a && /^(input|textarea)$/i.test(a.tagName)) return;
  if (a && a.isContentEditable) return;
  if (ev.key === 'ArrowLeft') { cycle(-1); }
  if (ev.key === 'ArrowRight') { cycle(1); }
});

/* 度量面板首次渲染时把四组数字打到控制台，方便复跑对照 */
setVariant(readVariant());
(function () {
  var lines = ['[原型度量] 口径：一次点击 = 1 步（不含键盘输入），「保存」计 1 步'];
  for (var i = 0; i < VARIANTS.length; i++) {
    var m = measure(VARIANTS[i].k);
    lines.push('  ' + m.v + ' ' + VARIANTS[i].name +
      '：首页→记账→保存 ' + m.r1 + ' 步 | 记完→流水 ' + m.r2 + ' 步 | 首页→股票 ' + m.r3 +
      ' 步 | 最坏(从 ' + m.worstFrom + ')→保存 ' + m.worst + ' 步');
  }
  if (window.console && console.log) console.log(lines.join('\n'));
})();
</script>
